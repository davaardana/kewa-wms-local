<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOSA WMS — Sedang Offline</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        text-align: center;
        background-color: #090d16;
        color: #f1f5f9;
      }
      .container {
        max-width: 480px;
        padding: 36px 28px;
        background-color: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      .icon-box {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px auto;
      }
      .icon-box svg {
        width: 36px;
        height: 36px;
        stroke: #10b981;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 12px 0;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.6;
        margin: 0 0 24px 0;
      }
      .status-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        color: #f59e0b;
        background: rgba(245, 158, 11, 0.15);
        border: 1px solid rgba(245, 158, 11, 0.3);
        padding: 4px 12px;
        border-radius: 9999px;
        margin-bottom: 20px;
      }
      .button {
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        transition: transform 0.1s, opacity 0.2s;
      }
      .button:active {
        transform: scale(0.98);
      }
      .button:hover {
        opacity: 0.95;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon-box">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.535 8.535A7.5 7.5 0 0119.5 12m-2.929 2.929A4.5 4.5 0 0112 16.5m0-9a4.5 4.5 0 014.243 3M1.5 12A10.5 10.5 0 0112 1.5m0 0a10.5 10.5 0 017.425 3.075M12 22.5A10.5 10.5 0 011.5 12" />
        </svg>
      </div>
      <div class="status-badge">Mode Offline Aktif</div>
      <h1>Jaringan Belum Terhubung</h1>
      <p>
        Perangkat Anda sedang tidak terhubung ke jaringan internet. Riwayat dan sesi yang telah disimpan dalam memori lokal tetap terjaga. Silakan periksa koneksi data atau Wi-Fi gudang.
      </p>
      <button class="button" onclick="window.location.reload()">Coba Hubungkan Kembali</button>
    </div>
  </body>
</html>
