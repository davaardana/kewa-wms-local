name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: edge-bridge/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development Compose
        run: docker compose --env-file .env.deploy.example -f docker-compose.yml config --quiet
      - name: Validate production Compose
        run: docker compose --env-file .env.deploy.example -f docker-compose.production.yml -f docker-compose.ubuntu-production.yml config --quiet
      - name: Build production images
        run: docker compose --env-file .env.deploy.example -f docker-compose.production.yml build nginx backend edge-bridge
