[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data

; Multi-Worker Process Concurrency Tuning
pm = dynamic
pm.max_children = 30
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 1000

request_terminate_timeout = 120s
