server {
    listen 80;
    server_name localhost;
    client_max_body_size 64M;

    # Frontend React SPA
    location / {
        root /var/www/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API & Storage
    location /api {
        root /var/www/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage {
        alias /var/www/backend/storage/app/public;
        try_files $uri $uri/ =404;
    }

    # Pass PHP scripts to PHP-FPM FastCGI server
    location ~ \.php$ {
        root /var/www/backend/public;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Edge Bridge WebSocket Proxy (ws://localhost/edge-ws -> ws://edge-bridge:2078)
    location /edge-ws {
        proxy_pass http://edge-bridge:2078;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Security headers & gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
