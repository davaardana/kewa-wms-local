server {
    listen 80;
    server_name localhost;
    client_max_body_size 64M;

    # ── Percepatan #1: Gzip compression ───────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff2;

    # ── Percepatan #2: Cache-Control immutable untuk Vite hashed assets ────────
    location ~* /assets/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|webp|avif|ico)$ {
        root /var/www/frontend/dist;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
        try_files $uri =404;
    }

    # ── WebSocket Edge Bridge ─────────────────────────────────────────────────
    # Edge-bridge dijalankan di PC lokal (bukan VPS container)
    # Browser connect langsung ke ws://IP_PC_LOKAL:2078
    # location /ws-edge/ { ... } — dinonaktifkan, edge-bridge tidak di VPS

    # ── Frontend React SPA ────────────────────────────────────────────────────
    location / {
        root /var/www/frontend/dist;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff;
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API & Storage ─────────────────────────────────────────────────
    location /api {
        root /var/www/backend/public;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_hide_header Date;
        add_header Cache-Control "no-store";
    }

    location /storage {
        alias /var/www/backend/storage/app/public;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri/ =404;
    }

    # ── SSE Streams — fastcgi_buffering off agar event real-time ────────────────
    # X-Accel-Buffering: no header dari PHP hanya bekerja di proxy_pass,
    # bukan fastcgi_pass. Location ini intercept sebelum generic PHP handler.
    #
    # /api/enrollment/stream — live tag scan untuk TagEnrollment (browser luar LAN)
    # /api/gate/stream       — live gate events untuk GateMonitor (SSE fallback)
    # /api/edge/events       — VPS push ke edge-bridge (config/doc changes)
    location ~ ^/api/(enrollment/stream|gate/stream|edge/events)$ {
        root /var/www/backend/public;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffering off;
        fastcgi_hide_header Date;
        gzip off;
    }

    # ── Pass PHP scripts to PHP-FPM FastCGI server ────────────────────────────
    location ~ \.php$ {
        root /var/www/backend/public;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;

        # Fix: hide duplicate Date header dari FastCGI (menyebabkan SSE 500)
        fastcgi_hide_header Date;

        # API response: short cache for GET, no-store for mutations
        add_header Cache-Control "no-store";
    }
}

